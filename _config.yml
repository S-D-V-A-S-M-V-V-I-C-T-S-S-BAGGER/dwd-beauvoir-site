# Welcome to Jekyll!

title: D.W.D. Beauvoir
email: beauvoirbestuur@gmail.com
description: Dames Wedstrijd Dispuut Beauvoir
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://dwdbeauvoir.nl/"
# twitter_username: jekyllrb
# github_username:  jekyll
# We're using formspree.io for form handling, paste your formspree url below
# fabFormUrl: "https://fabform.io/f/Ecj6gBK"

# Build settings
gems:
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 2
  permalink: '/blog/:num/'
  sort_field: 'date'
  sort_reverse: true

sass:
  sass_dir: _scss/
  style: compressed

webrick:
  headers:
    Access-Control-Allow-Origin: "*"

# Navigation
navigation:
  - title: Home
    url: /
  - title: Historie
    url: /about
  - title: Bestuur
    url: /portfolio
  - title: Leden
    url: /blog
  - title: Contact
    url: /contact
    tag: special

# Call to action
call-to-action:
  enable                : true
  background_image      : "images/backgrounds/cta-background.jpg"
  title                 : "Heb je een vraag?"
  primary_button        : "Stuur een vraag"
  primary_button_url    : "/contact"
  secondary_button      : "Historie"
  secondary_button_url  : "/historie"

# Footer
footer:
  contactInfo:
    title   : "Contact Info"
    address : "Auke Vleerstraat 99 Enschede"
    # phone   : "409-896-1444"
    email   : "beauvoirbestuur@gmail.com"
  sitemap:
    title: "Sitemap"
    link: 
      - name  : "Historie"
        url   : "/historie"
      - name  : "Leden"
        url   : "/leden"
      - name  : "Bestuur"
        url   : "/bestuur"
      - name  : "Contact"
        url   : "/contact"
  social:
    title: "Social Media"
    link: 
      # - name  : "Medium"
      #   url   : "#"
      # - name  : "Behance"
      #   url   : "#"
      # - name  : "Dribbble"
      #   url   : "#"
      - name  : "Instagram"
        url   : "https://www.instagram.com/d.w.d.beauvoir"

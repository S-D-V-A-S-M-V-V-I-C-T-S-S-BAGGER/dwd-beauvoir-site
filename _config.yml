title: D.W.D. Beauvoir
email: beauvoirbestuur@gmail.com
description: Dames Wedstrijd Dispuut Beauvoir
domain: dwdbeauvoir.nl
url: https://dwdbeauvoir.nl


gems:
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 2
  permalink: '/historie/:num/'
  sort_field: 'date'
  sort_reverse: true

sass:
  sass_dir: _scss/
  style: compressed

webrick:
  headers:
    Access-Control-Allow-Origin: "*"

# Navigation
navigation:
  - title: Home
    url: /
  - title: Historie
    url: /historie
  - title: Bestuur
    url: /bestuur
  - title: Leden
    url: /leden
  - title: Contact
    url: /contact
    tag: special

# Call to action
call-to-action:
  enable                : true
  background_image      : "images/backgrounds/cta-background.jpg"
  title                 : "Heb je een vraag?"
  primary_button        : "Stuur een vraag"
  primary_button_url    : "/contact"
  secondary_button      : "Historie"
  secondary_button_url  : "/historie"

# Footer
footer:
  contactInfo:
    title   : "Contact Info"
    address : "Auke Vleerstraat 99"
    city    : "Enschede"
    email   : "beauvoirbestuur@gmail.com"
  sitemap:
    title: "Sitemap"
    link: 
      - name  : "Historie"
        url   : "/historie"
      - name  : "Leden"
        url   : "/leden"
      - name  : "Bestuur"
        url   : "/bestuur"
      - name  : "Contact"
        url   : "/contact"
  social:
    title: "Social Media"
    link: 
      - name  : "Instagram"
        url   : "https://www.instagram.com/d.w.d.beauvoir"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
